# CI: chạy test mỗi lần push/PR. Deploy do Vercel và Render tự làm khi code vào nhánh main.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: talent
          POSTGRES_PASSWORD: talent
          POSTGRES_DB: talentcompass
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U talent" --health-interval 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://talent:talent@localhost:5432/talentcompass
      LLM_MOCK: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: alembic upgrade head
      - run: pytest -q
      - name: Docker image builds
        run: docker build -t talentcompass-api .

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://example.invalid
